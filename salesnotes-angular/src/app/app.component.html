<!-- Authenticated Layout -->
<div *ngIf="isLoggedIn() && !isLoginPage()" class="app-container">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">💼</span>
        <div class="brand-text">
          <span class="brand-title">SalesNotes</span>
          <span class="platform-tag">Angular Web</span>
        </div>
      </div>

      <nav class="main-nav">
        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
          📊 Dashboard
        </a>
        <a routerLink="/notes" routerLinkActive="active" class="nav-item">
          📝 Sales Notes
        </a>
        <a routerLink="/customers" routerLinkActive="active" class="nav-item">
          👥 Customers
        </a>
        <a *ngIf="canAccessUsers()" routerLink="/users" routerLinkActive="active" class="nav-item">
          👤 Users
        </a>
        <a *ngIf="canAccessRoles()" routerLink="/roles" routerLinkActive="active" class="nav-item">
          🛡️ Roles
        </a>
      </nav>

      <div class="header-user-actions">
        <div class="user-badge-info" *ngIf="getCurrentUser() as user">
          <span class="user-name">{{ user.fullname || user.username }}</span>
          <span class="role-pill" [attr.data-role]="user.role">{{ user.role }}</span>
        </div>
        <a routerLink="/notes/new" class="btn btn-primary btn-sm">+ New Note</a>
        <button class="btn btn-outline btn-sm btn-logout" (click)="onLogout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <p>SalesNotes Platform &bull; Powered by Angular + Ionic + Spring Boot &bull; Common Component Pattern</p>
  </footer>
</div>

<!-- Unauthenticated / Login View -->
<div *ngIf="!isLoggedIn() || isLoginPage()">
  <router-outlet></router-outlet>
</div>
