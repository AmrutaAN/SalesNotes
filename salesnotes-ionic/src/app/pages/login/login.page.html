<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>SalesNotes Mobile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding login-content">
  <div class="login-container">
    <ion-card class="login-card">
      <ion-card-header class="ion-text-center">
        <ion-card-title>Sign In</ion-card-title>
        <ion-card-subtitle>Enter into system using authorized credentials</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <div *ngIf="errorMessage" class="error-box">
          <ion-text color="danger">{{ errorMessage }}</ion-text>
        </div>

        <form (ngSubmit)="onSubmit()">
          <ion-item lines="inset" class="input-item">
            <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
            <ion-input
              label="Username"
              labelPlacement="floating"
              [(ngModel)]="username"
              name="username"
              required
              autocomplete="username"
            ></ion-input>
          </ion-item>

          <ion-item lines="inset" class="input-item">
            <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
            <ion-input
              label="Password"
              labelPlacement="floating"
              type="password"
              [(ngModel)]="password"
              name="password"
              required
              autocomplete="current-password"
            ></ion-input>
          </ion-item>

          <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="loading">
            <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>
            <ion-icon *ngIf="!loading" name="log-in-outline" slot="start"></ion-icon>
            {{ loading ? 'Signing in...' : 'Sign In' }}
          </ion-button>
        </form>

        <div class="demo-accounts ion-margin-top">
          <ion-text color="medium">
            <small>Quick Demo Roles:</small>
          </ion-text>
          <div class="demo-buttons">
            <ion-button size="small" fill="outline" color="tertiary" (click)="selectPreset('sysadmin', 'SysAdmin@123')">
              SuperUser
            </ion-button>
            <ion-button size="small" fill="outline" color="primary" (click)="selectPreset('companyadmin', 'Admin@123')">
              Admin
            </ion-button>
            <ion-button size="small" fill="outline" color="success" (click)="selectPreset('companyemployee', 'User@123')">
              Field Rep
            </ion-button>
          </div>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
