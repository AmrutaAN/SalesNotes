# Development Local Profile (devlocal)
server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:salesnotesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  environment: devlocal
  profile-description: "Local development with in-memory H2 SQL database and seeded test data"
