# ==============================================================================
# DEVLOCAL Profile: Local MariaDB Database (configured via HeidiSQL)
# Settings match HeidiSQL: Host 127.0.0.1, Port 3306, Database salesnotes, User root
# ==============================================================================
server:
  port: 8080

spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mariadb://127.0.0.1:3306/salesnotes?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC}
    driver-class-name: ${LOCAL_DB_DRIVER:org.mariadb.jdbc.Driver}
    username: ${LOCAL_DB_USERNAME:root}
    password: ${LOCAL_DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

app:
  environment: devlocal
  database-type: "Local MariaDB Database (HeidiSQL: 127.0.0.1:3306/salesnotes)"
