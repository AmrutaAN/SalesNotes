# ==============================================================================
# DEVLOCAL Profile: Local System Database
# Connects to your local system database
# ==============================================================================
server:
  port: 8080

spring:
  datasource:
    # Local System Database:
    # Defaults to local system database file (can be overridden with local MySQL or local Postgres)
    url: ${LOCAL_DB_URL:jdbc:h2:file:./data/salesnotes_local;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    driver-class-name: ${LOCAL_DB_DRIVER:org.h2.Driver}
    username: ${LOCAL_DB_USERNAME:sa}
    password: ${LOCAL_DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  environment: devlocal
  database-type: "Local System Database"
