# ==============================================================================
# PROD Profile: Hosted MariaDB / MySQL Database Server
# Connects to your hosted database on a remote server/cloud with a custom host
# ==============================================================================
server:
  port: ${PORT:8080}

spring:
  datasource:
    # Configure via PROD_DB_HOST, PROD_DB_PORT, PROD_DB_NAME, PROD_DB_USERNAME, PROD_DB_PASSWORD
    # or supply full PROD_DB_URL / SPRING_DATASOURCE_URL
    url: ${PROD_DB_URL:${SPRING_DATASOURCE_URL:jdbc:mariadb://${PROD_DB_HOST:hosted-mariadb-server.com}:${PROD_DB_PORT:3306}/${PROD_DB_NAME:salesnotes}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC}}
    driver-class-name: ${PROD_DB_DRIVER:${SPRING_DATASOURCE_DRIVER:org.mariadb.jdbc.Driver}}
    username: ${PROD_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
    password: ${PROD_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  environment: prod
  database-type: "Hosted MariaDB Database Server"
