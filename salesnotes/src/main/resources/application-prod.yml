# ==============================================================================
# PROD Profile: Hosted Database from Server
# Connects to your hosted database on a remote server/cloud
# ==============================================================================
server:
  port: ${PORT:8080}

spring:
  datasource:
    # Hosted Database Server (AWS RDS, Neon, Supabase, Azure, Google Cloud SQL, etc.)
    url: ${HOSTED_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://hosted-db-server.yourcloud.com:5432/salesnotes_prod?sslmode=require}}
    driver-class-name: ${HOSTED_DB_DRIVER:${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}}
    username: ${HOSTED_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:salesnotes_admin}}
    password: ${HOSTED_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:HostedPassword123!}}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  environment: prod
  database-type: "Hosted Database from Server"
