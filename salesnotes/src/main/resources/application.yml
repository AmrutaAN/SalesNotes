server:
  port: 8080

spring:
  application:
    name: salesnotes
  profiles:
    active: @active.profile@

salesnotes:
  jwt:
    secret: ${JWT_SECRET:salesnotes-super-secret-key-for-jwt-token-generation-minimum-256-bits-length-required}
    access-token-expiration-ms: 3600000       # 1 hour
    refresh-token-expiration-ms: 2592000000   # 30 days

